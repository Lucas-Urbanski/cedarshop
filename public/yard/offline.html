<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#093d30" />
    <title>Cedar Yard | Offline</title>

    <style>
      body {
        font: 16px system-ui;
        background: #f5f4ef;
        color: #173f30;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        max-width: 420px;
        padding: 32px;
      }

      small {
        letter-spacing: 0.15em;
      }

      h1 {
        font-size: 38px;
        line-height: 1.1;
      }

      p {
        line-height: 1.7;
        color: #536358;
      }

      button {
        background: #116343;
        color: white;
        border: 0;
        padding: 15px 24px;
        font: inherit;
        border-radius: 6px;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <main>
      <small>THE CEDAR SHOP · YARD</small>
      <h1>You’re offline.</h1>

      <p>
        Reconnect to open the yard workspace. Demo changes already saved on
        this device are still stored in this browser.
      </p>

      <p>
        Offline editing and automatic sync are not available in this prototype.
      </p>

      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
